# Runs on every push and pull request:
#   1. unit tests (SQL features, leakage guards, metrics, validation, baseline)
#   2. the full pipeline on synthetic sample data, as a smoke test
# The real Kaggle data is never needed here.

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Unit tests
        run: pytest

      - name: End-to-end smoke test on synthetic data
        run: python -m src.pipeline --sample

      - name: Stage 2 smoke test (quick tuning on synthetic data)
        run: python -m src.train_models --sample --quick --no-tracking

      - name: Stage 3 smoke test (calibration and pricing on synthetic data)
        run: python -m src.price_loans --sample --no-tracking

      - name: Stage 4 smoke test (reason codes, fairness, model card on synthetic data)
        run: python -m src.explain_and_audit --sample --no-tracking
